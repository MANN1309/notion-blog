<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 갱신</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .button:active {
      transform: translateY(0);
    }
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .message.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 블로그 갱신</h1>
    <button id="triggerButton" class="button">갱신하기</button>
    <div id="message" class="message" style="display: none;"></div>
  </div>

  <script>
    const API_URL = window.location.origin + '/api/revalidate';
    
    document.getElementById('triggerButton').addEventListener('click', async function() {
      const button = document.getElementById('triggerButton');
      const messageElement = document.getElementById('message');
      
      button.disabled = true;
      messageElement.style.display = 'flex';
      messageElement.className = 'message loading';
      messageElement.innerHTML = '<span class="spinner"></span>요청 전송 중...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          mode: 'cors',
        });

        const data = await response.json();

        if (response.ok && data.revalidated) {
          messageElement.className = 'message success';
          messageElement.textContent = '✅ ' + (data.message || '갱신 요청이 성공적으로 전송되었습니다!');
        } else {
          messageElement.className = 'message error';
          messageElement.textContent = '❌ ' + (data.error || '요청 전송에 실패했습니다.');
        }
      } catch (error) {
        console.error('Error:', error);
        messageElement.className = 'message error';
        messageElement.textContent = '❌ 네트워크 오류: ' + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
