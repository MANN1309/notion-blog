<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .trigger-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .trigger-button {
      display: inline-block;
      margin-bottom: 10px;
      padding: 12px 24px;
      background-color: #4c9aff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s;
    }

    .trigger-button:hover {
      background-color: #2e86ff;
    }

    .trigger-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .message {
      font-size: 14px;
      color: #333;
      margin-top: 10px;
      min-height: 20px;
      padding: 8px;
      border-radius: 4px;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="trigger-container">
    <button id="triggerButton" class="trigger-button">🔄 블로그 갱신하기</button>
    <div id="message" class="message"></div>
  </div>

  <script>
  // ⚠️ 아래 정보를 본인의 정보로 변경하세요!
  const GITHUB_USERNAME = 'MANN1309';  // GitHub 사용자명
  const GITHUB_REPO = 'notion-blog';   // 리포지토리 이름
  const GITHUB_TOKEN = 'YOUR_GITHUB_PERSONAL_ACCESS_TOKEN';  // GitHub Personal Access Token
  
  // ⚠️ 중요: event_type을 "notion-sync"로 설정 (현재 워크플로우와 일치)
  const EVENT_TYPE = 'notion-sync';

  document.getElementById("triggerButton").addEventListener("click", function() {
    var button = document.getElementById("triggerButton");
    var messageElement = document.getElementById("message");
    
    // 토큰 확인
    if (GITHUB_TOKEN === 'YOUR_GITHUB_PERSONAL_ACCESS_TOKEN') {
      messageElement.textContent = "❌ GitHub Token을 설정해주세요!";
      messageElement.className = "message error";
      return;
    }
    
    button.disabled = true;
    messageElement.textContent = "요청 전송 중...";
    messageElement.className = "message";

    var xhr = new XMLHttpRequest();
    var url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/dispatches`;
    
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Accept", "application/vnd.github.v3+json");
    xhr.setRequestHeader("Authorization", "Bearer " + GITHUB_TOKEN);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
      button.disabled = false;
      if (xhr.status === 204) {
        messageElement.textContent = "✅ 요청이 성공적으로 전송되었습니다! (상태 코드: " + xhr.status + ")";
        messageElement.className = "message success";
      } else {
        var errorMsg = "❌ 요청 전송에 실패했습니다. (상태 코드: " + xhr.status + ")";
        try {
          var response = JSON.parse(xhr.responseText);
          if (response.message) {
            errorMsg += "\n오류: " + response.message;
          }
        } catch (e) {
          errorMsg += "\n응답: " + xhr.responseText;
        }
        messageElement.textContent = errorMsg;
        messageElement.className = "message error";
      }
    };

    xhr.onerror = function() {
      button.disabled = false;
      messageElement.textContent = "❌ 요청 전송 중 알 수 없는 오류가 발생했습니다.";
      messageElement.className = "message error";
    };

    xhr.send(JSON.stringify({
      "event_type": EVENT_TYPE
    }));
  });
  </script>
</body>
</html>
