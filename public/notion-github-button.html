<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .trigger-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .trigger-button {
      display: inline-block;
      margin-bottom: 10px;
      padding: 12px 24px;
      background-color: #4c9aff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s;
    }

    .trigger-button:hover {
      background-color: #2e86ff;
    }

    .trigger-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .message {
      font-size: 14px;
      color: #333;
      margin-top: 10px;
      min-height: 20px;
      padding: 8px;
      border-radius: 4px;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="trigger-container">
    <button id="triggerButton" class="trigger-button">🔄 블로그 갱신하기</button>
    <div id="message" class="message"></div>
  </div>

  <script>
  // ✅ 방법 1: iframe으로 /revalidate 페이지를 로드하고 버튼 클릭 트리거
  const REVALIDATE_URL = window.location.origin + '/revalidate';
  var revalidateIframe = null;

  document.getElementById("triggerButton").addEventListener("click", function() {
    var button = document.getElementById("triggerButton");
    var messageElement = document.getElementById("message");
    
    // iframe이 없으면 생성
    if (!revalidateIframe) {
      messageElement.textContent = "페이지 로딩 중...";
      messageElement.className = "message";
      
      // 숨겨진 iframe 생성
      revalidateIframe = document.createElement('iframe');
      revalidateIframe.src = REVALIDATE_URL;
      revalidateIframe.style.display = 'none';
      revalidateIframe.style.width = '0';
      revalidateIframe.style.height = '0';
      document.body.appendChild(revalidateIframe);
      
      // iframe 로드 대기
      revalidateIframe.onload = function() {
        button.disabled = false;
        messageElement.textContent = "✅ 준비 완료! 버튼을 다시 클릭하세요.";
        messageElement.className = "message success";
      };
      
      return;
    }
    
    button.disabled = true;
    messageElement.textContent = "요청 전송 중...";
    messageElement.className = "message";
    
    // iframe에 메시지 전송하여 버튼 클릭 트리거
    try {
      revalidateIframe.contentWindow.postMessage('trigger-revalidate', window.location.origin);
      
      var timeoutId = null;
      var isCompleted = false;
      
      // 결과를 받기 위한 리스너
      var messageListener = function(event) {
        if (event.origin !== window.location.origin) return;
        
        if (event.data && event.data.type === 'revalidate-result') {
          isCompleted = true;
          button.disabled = false;
          
          // 타임아웃 취소
          if (timeoutId) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }
          
          // 성공/실패 메시지 표시
          if (event.data.success) {
            messageElement.textContent = "✅ " + (event.data.message || "요청이 성공적으로 전송되었습니다!");
            messageElement.className = "message success";
          } else {
            messageElement.textContent = "❌ " + (event.data.error || "요청 전송에 실패했습니다.");
            messageElement.className = "message error";
          }
          
          window.removeEventListener('message', messageListener);
        }
      };
      
      window.addEventListener('message', messageListener);
      
      // 타임아웃 설정 (30초) - GitHub Actions가 트리거되는데 시간이 걸릴 수 있음
      timeoutId = setTimeout(function() {
        if (!isCompleted) {
          // 타임아웃 후에도 리스너는 유지 (나중에 응답이 오면 처리)
          button.disabled = false;
          messageElement.textContent = "⏱️ 응답 대기 중... (GitHub Actions가 실행 중일 수 있습니다. 잠시 후 다시 확인해주세요.)";
          messageElement.className = "message";
          
          // 추가 대기 후에도 응답이 없으면 타임아웃으로 처리
          setTimeout(function() {
            if (!isCompleted) {
              window.removeEventListener('message', messageListener);
              messageElement.textContent = "⏱️ 응답 시간 초과. GitHub Actions가 정상적으로 트리거되었는지 확인해주세요.";
              messageElement.className = "message";
            }
          }, 60000); // 추가 60초 대기
        }
      }, 30000); // 30초 타임아웃
      
    } catch (e) {
      button.disabled = false;
      messageElement.textContent = "❌ 오류: " + e.message;
      messageElement.className = "message error";
    }
  });
  </script>
</body>
</html>
