<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .trigger-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .trigger-button {
      display: inline-block;
      margin-bottom: 10px;
      padding: 12px 24px;
      background-color: #4c9aff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s;
    }

    .trigger-button:hover {
      background-color: #2e86ff;
    }

    .trigger-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .message {
      font-size: 14px;
      color: #333;
      margin-top: 10px;
      min-height: 20px;
      padding: 8px;
      border-radius: 4px;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="trigger-container">
    <button id="triggerButton" class="trigger-button">🔄 블로그 갱신하기</button>
    <div id="message" class="message"></div>
  </div>

  <script>
  // ✅ 방법: 직접 API 호출 (iframe 대신 - URI Too Long 에러 방지)
  const API_URL = window.location.origin + '/api/revalidate';

  document.getElementById("triggerButton").addEventListener("click", function() {
    var button = document.getElementById("triggerButton");
    var messageElement = document.getElementById("message");
    
    button.disabled = true;
    messageElement.textContent = "요청 전송 중...";
    messageElement.className = "message";

    // 직접 API 호출 (POST 요청 - URI 길이 제한 없음)
    var xhr = new XMLHttpRequest();
    xhr.open("POST", API_URL, true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
      button.disabled = false;
      
      // Content-Type 확인
      var contentType = xhr.getResponseHeader('Content-Type') || '';
      var isJson = contentType.includes('application/json');
      
      // HTML 응답인 경우 (에러 페이지)
      if (!isJson && xhr.responseText.trim().startsWith('<')) {
        var errorMsg = "❌ 서버 오류: HTML 응답을 받았습니다. ";
        if (xhr.status === 404) {
          errorMsg += "API 엔드포인트를 찾을 수 없습니다.";
        } else if (xhr.status === 500) {
          errorMsg += "서버 내부 오류가 발생했습니다.";
        } else {
          errorMsg += "상태 코드: " + xhr.status;
        }
        messageElement.textContent = errorMsg;
        messageElement.className = "message error";
        return;
      }
      
      // JSON 파싱 시도
      try {
        var response = JSON.parse(xhr.responseText);
        if (xhr.status === 200 && response.revalidated) {
          messageElement.textContent = "✅ " + (response.message || "요청이 성공적으로 전송되었습니다!");
          messageElement.className = "message success";
        } else {
          messageElement.textContent = "❌ " + (response.error || "요청 전송에 실패했습니다. (상태 코드: " + xhr.status + ")");
          messageElement.className = "message error";
        }
      } catch (e) {
        // JSON 파싱 실패
        var errorMsg = "❌ 응답 파싱 오류: " + e.message;
        if (xhr.responseText) {
          errorMsg += "\n응답 내용: " + xhr.responseText.substring(0, 200);
        }
        messageElement.textContent = errorMsg;
        messageElement.className = "message error";
      }
    };

    xhr.onerror = function() {
      button.disabled = false;
      messageElement.textContent = "❌ 네트워크 오류: 요청을 전송할 수 없습니다. CORS 문제일 수 있습니다.";
      messageElement.className = "message error";
    };
    
    // 타임아웃 설정 (30초)
    xhr.timeout = 30000;
    xhr.ontimeout = function() {
      button.disabled = false;
      messageElement.textContent = "⏱️ 요청 시간 초과 (30초). 서버 응답이 지연되고 있습니다.";
      messageElement.className = "message error";
    };

    xhr.send();
  });
  </script>
</body>
</html>
