<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    .trigger-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .trigger-button {
      display: inline-block;
      margin-bottom: 10px;
      padding: 12px 24px;
      background-color: #4c9aff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s;
    }

    .trigger-button:hover {
      background-color: #2e86ff;
    }

    .trigger-button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .message {
      font-size: 14px;
      color: #333;
      margin-top: 10px;
      min-height: 20px;
      padding: 8px;
      border-radius: 4px;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="trigger-container">
    <button id="triggerButton" class="trigger-button">🔄 블로그 갱신하기</button>
    <div id="message" class="message"></div>
  </div>

  <script>
  // ✅ 안전한 방법: 서버 API 엔드포인트 사용 (토큰 노출 없음)
  // 현재 도메인을 자동으로 감지하여 API 호출
  const API_URL = window.location.origin + '/api/revalidate';

  document.getElementById("triggerButton").addEventListener("click", function() {
    var button = document.getElementById("triggerButton");
    var messageElement = document.getElementById("message");
    
    button.disabled = true;
    messageElement.textContent = "요청 전송 중...";
    messageElement.className = "message";

    var xhr = new XMLHttpRequest();
    xhr.open("POST", API_URL, true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
      button.disabled = false;
      try {
        var response = JSON.parse(xhr.responseText);
        if (xhr.status === 200 && response.revalidated) {
          messageElement.textContent = "✅ " + (response.message || "요청이 성공적으로 전송되었습니다!");
          messageElement.className = "message success";
        } else {
          messageElement.textContent = "❌ " + (response.error || "요청 전송에 실패했습니다. (상태 코드: " + xhr.status + ")");
          messageElement.className = "message error";
        }
      } catch (e) {
        messageElement.textContent = "❌ 응답 파싱 오류: " + e.message;
        messageElement.className = "message error";
      }
    };

    xhr.onerror = function() {
      button.disabled = false;
      messageElement.textContent = "❌ 요청 전송 중 알 수 없는 오류가 발생했습니다.";
      messageElement.className = "message error";
    };

    xhr.send();
  });
  </script>
</body>
</html>
